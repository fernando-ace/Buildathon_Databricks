[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
ahash = "0.8"
arrow-array = "60.1.0"
arrow-schema = "60.1.0"
memchr = "2.7"
parquet = { version = "60.1.0", default-features = false, features = ["arrow", "zstd"] }
rayon = "1.11"
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

